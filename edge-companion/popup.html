<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>애니 자막 찾기 연결</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>애니 자막 찾기</h1>
  <p>앱이 켜져 있으면 현재 탭 제목과 주소를 보낼 수 있음. 확장 없이 앱에서 제목을 직접 검색해도 됨.</p>
  <label for="token">앱에 표시된 엣지 연동 코드</label>
  <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="연동 코드 붙여넣기">
  <div class="row">
    <button id="test" type="button">연결 확인</button>
    <button id="send" type="button">현재 탭 보내기</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
